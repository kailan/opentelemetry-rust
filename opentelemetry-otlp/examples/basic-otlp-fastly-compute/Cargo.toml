[package]
name = "basic-otlp-fastly-compute"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
autobenches = false

[profile.release]
debug = 1
codegen-units = 1
lto = "fat"

[dependencies]
fastly = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { workspace = true, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry-otlp = { workspace = true, default-features = false, features = [
  "fastly-client",
  "http-proto",
  "trace",
  "metrics",
  "logs",
  "internal-logs",
] }
opentelemetry-appender-tracing = { workspace = true }

tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "registry",
  "std",
  "fmt",
] }

[lints]
workspace = true
